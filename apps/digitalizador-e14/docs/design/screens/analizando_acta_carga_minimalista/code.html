  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full min-h-[751px] justify-between items-center px-gutter select-none">
<!-- Top Status Beacon -->
<div class="w-full flex items-center justify-between pt-unit">
<div class="flex items-center gap-unit bg-surface-container-low px-card-padding py-unit rounded-full">
<span class="inline-block w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">EN PROCESO</span>
</div>
<div class="font-body-md text-body-md text-outline">
<span id="scan-latency">18ms</span>
</div>
</div>
<!-- Center Focal Area: Circular Scanner & Status -->
<div class="flex flex-col items-center justify-center my-auto w-full max-w-xs">
<!-- Concentric Target Display -->
<div class="relative flex items-center justify-center w-48 h-48 mb-container-margin">
<!-- Ambient Glow Behind Ring -->
<div class="absolute inset-0 rounded-full bg-primary/10 blur-xl"></div>
<!-- Outer Radar Track -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 160 160">
<!-- Static Track -->
<circle class="text-surface-variant/40" cx="80" cy="80" fill="none" r="68" stroke="currentColor" stroke-width="2"></circle>
<!-- Animated Ring Dash -->
<circle class="text-primary transition-all duration-300 ease-out" cx="80" cy="80" fill="none" id="progress-circle" r="68" stroke="currentColor" stroke-dasharray="427.25" stroke-dashoffset="310" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<!-- Mid Pulse Ring -->
<div class="absolute w-36 h-36 rounded-full bg-surface-container-high flex items-center justify-center">
<!-- Inner Core Scanning Area -->
<div class="relative w-28 h-28 rounded-full bg-surface-container flex flex-col items-center justify-center overflow-hidden">
<!-- Sweeping Scan Bar -->
<div class="absolute inset-x-0 h-1 bg-gradient-to-b from-transparent via-primary to-transparent opacity-75 animate-bounce"></div>
<!-- Document Icon Container -->
<div class="relative z-10 flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-primary text-[38px] drop-shadow-[0_0_8px_rgba(63,229,108,0.45)]">
              document_scanner
            </span>
</div>
<!-- Live Percentage Badge -->
<div class="absolute bottom-2 z-10 font-stats-number text-body-md text-primary" id="percent-counter">
            42%
          </div>
</div>
</div>
<!-- Peripheral Corner Micro Marks -->
<div class="absolute -top-1 -left-1 w-2.5 h-2.5 border-t border-l border-primary/40 pointer-events-none"></div>
<div class="absolute -top-1 -right-1 w-2.5 h-2.5 border-t border-r border-primary/40 pointer-events-none"></div>
<div class="absolute -bottom-1 -left-1 w-2.5 h-2.5 border-b border-l border-primary/40 pointer-events-none"></div>
<div class="absolute -bottom-1 -right-1 w-2.5 h-2.5 border-b border-r border-primary/40 pointer-events-none"></div>
</div>
<!-- Typography Hierarchy -->
<div class="flex flex-col items-center text-center px-unit space-y-unit">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
        Analizando acta
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[260px] min-h-[36px] transition-opacity duration-200" id="dynamic-status-message">
        Optimizando contraste y lectura del documento...
      </p>
</div>
<!-- Segmented Linear Ticker Indicator -->
<div class="w-40 flex items-center justify-between gap-1 mt-card-padding">
<span class="h-1 flex-1 rounded bg-primary"></span>
<span class="h-1 flex-1 rounded bg-primary animate-pulse"></span>
<span class="h-1 flex-1 rounded bg-surface-variant"></span>
<span class="h-1 flex-1 rounded bg-surface-variant"></span>
</div>
</div>
<!-- Bottom Brand & Integrity Stamp -->
<div class="w-full flex flex-col items-center pb-card-padding gap-unit">
<div class="flex items-center gap-2 bg-surface-container-lowest px-card-padding py-1 rounded-full">
<span class="material-symbols-outlined text-outline text-base" style="font-variation-settings: 'FILL' 1;">
        verified_user
      </span>
<span class="font-label-caps text-label-caps text-outline tracking-wider">
        E-14 DIGITALIZADOR
      </span>
</div>
<span class="font-body-md text-body-md text-outline-variant text-center">
      HASH SHA-256 EN COLA • NODO 04
    </span>
</div>
</div>
<script>
  (function () {
    const messages = [
      "Optimizando contraste y lectura del documento...",
      "Calibrando bordes y código de barras...",
      "Extrayendo matriz de sufragios...",
      "Verificando integridad criptográfica..."
    ];
    let step = 0;
    let progress = 42;
    const progressCircle = document.getElementById("progress-circle");
    const percentCounter = document.getElementById("percent-counter");
    const statusMsg = document.getElementById("dynamic-status-message");
    const latencyEl = document.getElementById("scan-latency");

    const circumference = 427.25;

    function updateProgress(value) {
      if (!progressCircle || !percentCounter) return;
      const offset = circumference - (value / 100) * circumference;
      progressCircle.style.strokeDashoffset = offset;
      percentCounter.textContent = Math.round(value) + "%";
    }

    const timer = setInterval(() => {
      progress += Math.floor(Math.random() * 8) + 4;
      if (progress >= 100) {
        progress = 100;
        updateProgress(progress);
        if (statusMsg) statusMsg.textContent = "Validación completada con éxito";
        clearInterval(timer);
        return;
      }
      updateProgress(progress);

      // Rotate status messages smoothly
      const nextStep = Math.floor((progress / 100) * messages.length);
      if (nextStep !== step && messages[nextStep] && statusMsg) {
        step = nextStep;
        statusMsg.style.opacity = "0.2";
        setTimeout(() => {
          statusMsg.textContent = messages[step];
          statusMsg.style.opacity = "1";
        }, 150);
      }

      if (latencyEl) {
        latencyEl.textContent = (14 + Math.floor(Math.random() * 7)) + "ms";
      }
    }, 450);

    updateProgress(progress);
  })();
</script></main></body></html>
