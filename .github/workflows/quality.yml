name: Quality Gate

# Gate en PR y push a main: tipos (core + app) + lint + build estático.
# NO despliega (eso lo hace deploy-pages.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# SIN concurrency a nivel workflow: en workflow_call este bloque TAMBIÉN
# aplica (con el contexto del caller) y en push a main la corrida llamada
# por deploy-pages compartía grupo con la standalone (quality-refs/heads/main,
# cancel-in-progress) — la segunda en arrancar cancelaba a la primera y el
# deploy quedaba skipped (run 38974978246, push 874182c). La standalone y
# la llamada NO deben chocar: la llamada ya está protegida por el group del
# job `quality` en deploy-pages.yml (quality-deploy-<ref>), y la standalone
# es la única que corre en push. En PR cada ref de merge es su propio grupo
# implícito; cancel-in-progress se pierde (ruido menor: runs duplicados),
# se acepta a cambio de un deploy de main que nunca salta.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (workspace raíz)
        run: bun install --frozen-lockfile

      - name: Type check — packages/scanner-core
        run: bun run core:check

      - name: Type check — packages/scanner-ui
        run: bun run ui:check

      - name: Guard — scanner-ui sin imports del lab ni rutas externas
        run: |
          if grep -rEn "from ['\"](@/|apps/|\.\./\.\./)" packages/scanner-ui/src; then
            echo "::error::scanner-ui solo puede importar react/framer-motion/@jg-stevan/scanner-core y rutas relativas internas (./)"
            exit 1
          fi
          echo "guard OK: sin imports de @/ , apps/ ni ../.."

      - name: Build — packages/scanner-ui (dist js + d.ts)
        run: bun run ui:build

      - name: Type check — apps/scanner-lab
        run: bun run app:check

      - name: Lint — apps/scanner-lab
        run: bun run lint

      - name: Build estático scanner-lab (sanity)
        run: bun run build:static
