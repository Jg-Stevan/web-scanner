name: Deploy to GitHub Pages

# Construye la versión estática del escáner y la publica en Pages
# en cada push a la rama principal (o manualmente desde la pestaña Actions).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Activa el modo export estático de next.config.ts
      BUILD_STATIC: "1"
      # GitHub Pages sirve este repo bajo /web-scanner/
      NEXT_PUBLIC_BASE_PATH: /web-scanner
      # A2: el OCR local (Tesseract) sin intento de fetch a /api (inexistente en Pages)
      NEXT_PUBLIC_STATIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Nota: el gate `bunx tsc --noEmit` se dejó FUERA a propósito para que la
      # migración por pasos (subir código nuevo y borrar legado después) nunca
      # produzca un deploy rojo intermedio. Reactivarlo cuando el repo esté
      # limpio es una mejora futura de un solo paso.

      # Los route handlers (src/app/api) requieren servidor Node y son
      # incompatibles con el export estático. Se excluyen SOLO del build
      # de Pages (en local con `bun run dev` siguen disponibles).
      - name: Remove server-only API routes
        run: rm -rf apps/scanner-lab/src/app/api

      - name: Build estático (salida en apps/scanner-lab/out)
        run: bunx next build
        working-directory: apps/scanner-lab

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/scanner-lab/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
