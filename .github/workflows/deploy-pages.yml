name: Deploy to GitHub Pages

# Pages DUAL: construye AMBAS apps del monorepo y las publica en el mismo
# sitio — digitalizador-e14 en la raíz (demo pública) y scanner-lab en la
# subruta /lab/ (laboratorio de pruebas). Cada push a main re-despliega
# ambas; ya no hay selección de app (fin del modo switch).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Activa el modo export estático de next.config.ts (ambas apps)
      BUILD_STATIC: "1"
      # GitHub Pages sirve este repo bajo /web-scanner/
      NEXT_PUBLIC_BASE_PATH: /web-scanner
      # A2 (scanner-lab): OCR local sin fetch a /api (inexistente en Pages).
      # Inofensivo para digitalizador-e14 (no lee esta var).
      NEXT_PUBLIC_STATIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Nota: el gate `bunx tsc --noEmit` se dejó FUERA a propósito para que
      # la migración por pasos nunca produzca un deploy rojo intermedio.

      - name: Install dependencies (workspace raíz)
        run: bun install --frozen-lockfile

      # Los route handlers (src/app/api) requieren servidor Node y son
      # incompatibles con el export estático. Se excluyen SOLO del build de
      # Pages (solo scanner-lab los tiene; e14 no genera rutas de API).
      - name: Remove server-only API routes (scanner-lab)
        run: rm -rf apps/scanner-lab/src/app/api

      # Raíz del sitio: e14 usa el basePath por defecto del job (/web-scanner).
      - name: Build estático digitalizador-e14 (raíz del sitio)
        run: bunx next build
        working-directory: apps/digitalizador-e14

      # Subruta /lab/: el basePath de scanner-lab se sobreescribe a nivel de
      # step → /web-scanner/lab (assets, worker, manifest y sw auto-prefijados).
      - name: Build estático scanner-lab (subruta /lab/)
        working-directory: apps/scanner-lab
        env:
          NEXT_PUBLIC_BASE_PATH: /web-scanner/lab
        run: bunx next build

      # Anidar scanner-lab dentro del artifact final: /web-scanner/lab/.
      # Los _next/ de cada app viven en prefijos distintos → sin colisiones.
      - name: Anidar scanner-lab dentro del artifact final
        run: cp -r apps/scanner-lab/out apps/digitalizador-e14/out/lab

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/digitalizador-e14/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
