name: Deploy to GitHub Pages

# scanner-lab en la raíz: https://jg-stevan.github.io/web-scanner/
# Build estático con basePath /web-scanner (raíz de project pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # E-01 — el deploy ya no construye a ciegas: reutiliza el Quality Gate
  # (workflow_call) y build espera su veredicto. Sin esto, un push a main
  # con tipos rotos se desplegaba igual (quality corría EN PARALELO, no
  # bloqueando). El grupo de concurrencia propio evita la colisión con la
  # corrida standalone de quality.yml en push a main (mismo ref, grupo
  # quality-<ref> con cancel-in-progress — sin override, una cancela a la
  # otra al azar y el deploy se salta).
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
    concurrency:
      group: quality-deploy-${{ github.ref }}
      cancel-in-progress: false

  build:
    needs: quality
    runs-on: ubuntu-latest
    env:
      BUILD_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /web-scanner
      NEXT_PUBLIC_STATIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (workspace raíz)
        run: bun install --frozen-lockfile

      - name: Build estático scanner-lab (raíz del sitio)
        run: bunx next build
        working-directory: apps/scanner-lab

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/scanner-lab/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
