name: Deploy to GitHub Pages

# Construye la versión estática de una app del monorepo y la publica en
# Pages. En push a main despliega la app por defecto (digitalizador-e14);
# desde la pestaña Actions se puede elegir la app con el input `app`.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app:
        description: "App del monorepo a desplegar"
        type: choice
        options:
          - digitalizador-e14
          - scanner-lab
        default: digitalizador-e14

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Activa el modo export estático de next.config.ts (ambas apps)
      BUILD_STATIC: "1"
      # GitHub Pages sirve este repo bajo /web-scanner/
      NEXT_PUBLIC_BASE_PATH: /web-scanner
      # A2 (scanner-lab): OCR local sin fetch a /api (inexistente en Pages).
      # Inofensivo para digitalizador-e14 (no lee esta var).
      NEXT_PUBLIC_STATIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolver app a desplegar
        id: app
        run: echo "app=${{ inputs.app || 'digitalizador-e14' }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (workspace raíz)
        run: bun install --frozen-lockfile

      # Nota: el gate `bunx tsc --noEmit` se dejó FUERA a propósito para que
      # la migración por pasos nunca produzca un deploy rojo intermedio.

      # Los route handlers (src/app/api) requieren servidor Node y son
      # incompatibles con el export estático. Se excluyen SOLO del build de
      # Pages (solo scanner-lab los tiene; en e14 el rm es un no-op).
      - name: Remove server-only API routes
        run: rm -rf "apps/${{ steps.app.outputs.app }}/src/app/api"

      - name: Build estático (salida en apps/<app>/out)
        run: bunx next build
        working-directory: apps/${{ steps.app.outputs.app }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/${{ steps.app.outputs.app }}/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
